name: Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Wrapper & Build APK
        # If your files are inside the 'test-app-Release-app' folder, keep the working-directory line below.
        # If your files are directly in the root of the repo, remove the working-directory line.
        working-directory: ./test-app-Release-app
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "App Release v1.0.0"
          body: "Direct APK download ready to install on Android."
          draft: false
          prerelease: false
          files: '**/build/outputs/apk/debug/*.apk'
